[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fgs-dialogue-research"
version = "0.3.0"
description = "Reproducible experiments for value-sensitive dialogue filtering and refinement"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "gensim>=4.4,<5", "jieba>=0.42,<1"]

[project.optional-dependencies]
transformer = ["sentence-transformers>=3,<7"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
fgs = "fgs.cli:main"

[tool.setuptools.packages.find]
include = ["fgs*", "rating_app*"]

[tool.setuptools.package-data]
rating_app = ["static/*.html", "static/*.css", "static/*.js"]
